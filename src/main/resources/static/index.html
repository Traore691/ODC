<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Étudiants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(45deg, #0b0c10, #1f2833, #0b0c10);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff !important;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card {
            background-color: rgba(31, 40, 51, 0.85);
            border: 1px solid rgba(102, 252, 241, 0.2);
            backdrop-filter: blur(10px);
            color: #ffffff !important;
        }
        .card-header {
            background-color: transparent !important;
            border-bottom: 1px solid rgba(102, 252, 241, 0.2);
            color: #66fcf1 !important;
        }
        h2.text-primary {
            color: #45a29e !important;
        }
        .form-control {
            background-color: rgba(11, 12, 16, 0.8) !important;
            border: 1px solid rgba(69, 162, 158, 0.5) !important;
            color: #ffffff !important;
        }
        .form-control:focus {
            background-color: rgba(11, 12, 16, 1) !important;
            color: #ffffff !important;
            border-color: #66fcf1 !important;
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.5) !important;
        }
        .form-control::placeholder {
            color: #aaaaaa !important;
        }
        .table {
            color: #ffffff !important;
            background-color: transparent !important;
            --bs-table-color: #ffffff;
            --bs-table-bg: transparent;
            --bs-table-hover-color: #ffffff;
        }
        .table-dark {
            background-color: rgba(11, 12, 16, 0.9) !important;
            color: #66fcf1 !important;
            --bs-table-bg: rgba(11, 12, 16, 0.9);
            --bs-table-color: #66fcf1;
        }
        .table-hover tbody tr:hover {
            background-color: rgba(102, 252, 241, 0.1) !important;
            color: #ffffff !important;
        }
        td, th {
            border-color: rgba(102, 252, 241, 0.2) !important;
            background-color: transparent !important;
            color: #ffffff !important;
        }
        /* Sparkle effect */
        .sparkle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: #66fcf1;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px #45a29e;
            animation: twinkle 5s infinite linear;
            z-index: -1;
            pointer-events: none;
        }
        @keyframes twinkle {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.5); }
            100% { opacity: 0; transform: scale(0.5); }
        }
    </style>
</head>
<body>

<div class="container py-5">
    <h2 class="mb-4 text-primary">🎓 Gestion des Étudiants</h2>

    <!-- Formulaire d'ajout / modification -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header font-weight-bold" id="formTitle">Ajouter un étudiant</div>
        <div class="card-body">
            <form id="studentForm">
                <input type="hidden" id="studentId">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" id="nom" class="form-control" placeholder="Nom" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" id="prenom" class="form-control" placeholder="Prénom" required>
                    </div>
                    <div class="col-md-4">
                        <input type="date" id="dateNaissance" class="form-control" required>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-success" id="btnSave">Enregistrer</button>
                    <button type="button" class="btn btn-secondary d-none" id="btnCancel" onclick="resetForm()">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tableau de liste -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Date de Naissance</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody id="studentTableBody">
                <!-- Rempli dynamiquement par JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_URL = '/api/v1/students';

    document.addEventListener('DOMContentLoaded', () => {
        loadStudents();
        createSparkles();
    });

    // Generate sparkles
    function createSparkles() {
        for (let i = 0; i < 50; i++) {
            let sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.top = Math.random() * 100 + 'vh';
            sparkle.style.left = Math.random() * 100 + 'vw';
            sparkle.style.animationDuration = (Math.random() * 4 + 2) + 's';
            sparkle.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(sparkle);
        }
    }

    // Charger les étudiants
    async function loadStudents() {
        const res = await fetch(API_URL);
        const result = await res.json();
        const students = result.data || result;
        const tbody = document.getElementById('studentTableBody');
        tbody.innerHTML = '';

        students.forEach(s => {
            tbody.innerHTML += `
                <tr>
                    <td>${s.id}</td>
                    <td>${s.nom}</td>
                    <td>${s.prenom}</td>
                    <td>${s.dateNaissance || ''}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-warning me-1" onclick="editStudent(${s.id}, '${s.nom}', '${s.prenom}', '${s.dateNaissance}')">Éditer</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteStudent(${s.id})">Supprimer</button>
                    </td>
                </tr>
            `;
        });
    }

    // Soumettre le formulaire (Création ou Modification)
    document.getElementById('studentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('studentId').value;
        const studentData = {
            nom: document.getElementById('nom').value,
            prenom: document.getElementById('prenom').value,
            dateNaissance: document.getElementById('dateNaissance').value
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_URL}/${id}` : API_URL;

        await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(studentData)
        });

        resetForm();
        loadStudents();
    });

    // Remplir le formulaire pour modification
    function editStudent(id, nom, prenom, dateNaissance) {
        document.getElementById('studentId').value = id;
        document.getElementById('nom').value = nom;
        document.getElementById('prenom').value = prenom;
        document.getElementById('dateNaissance').value = dateNaissance;
        document.getElementById('formTitle').innerText = 'Modifier l\'étudiant #' + id;
        document.getElementById('btnSave').innerText = 'Mettre à jour';
        document.getElementById('btnCancel').classList.remove('d-none');
    }

    // Réinitialiser le formulaire
    function resetForm() {
        document.getElementById('studentId').value = '';
        document.getElementById('studentForm').reset();
        document.getElementById('formTitle').innerText = 'Ajouter un étudiant';
        document.getElementById('btnSave').innerText = 'Enregistrer';
        document.getElementById('btnCancel').classList.add('d-none');
    }

    // Supprimer un étudiant
    async function deleteStudent(id) {
        if (confirm('Voulez-vous vraiment supprimer cet étudiant ?')) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            loadStudents();
        }
    }
</script>
</body>
</html>
